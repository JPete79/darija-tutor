title: Greetings
phrases:
  - darija: السلام عليكم
    translit: salam alikum
    english: Hello / peace be upon you
  - darija: لاباس؟
    translit: labas?
    english: How are you? / Are you well?
  - darija: لاباس الحمد لله
    translit: labas, alhamdulillah
    english: I'm fine, thank God
  - darija: شنو خبارك؟
    translit: shnu khbarek?
    english: What's your news?
  - darija: بسلامة
    translit: bslama
    english: Goodbye
