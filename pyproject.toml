[project]
name = "darija-tutor"
version = "0.1.0"
description = "Voice-first conversational tutor for Moroccan Darija, built on open-source models"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
